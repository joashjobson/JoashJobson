<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin · Joash Jobson</title>
<meta name="description" content="Joash's admin page.">
<meta property="og:title" content="Admin · Joash Jobson">
<meta property="og:description" content="Joash's admin page.">
<meta name="theme-color" content="#FAF9F6">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..500&family=Archivo:wdth,wght@62..125,100..900&family=Schibsted+Grotesk:wght@400..700&family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/theme.js"></script>
</head>
<body class="admin">
<header class="topbar"><div class="topbar-in"><a href="/" class="home-link">Joash Jobson</a><span class="eyebrow">Admin</span></div></header>
<main class="adm">
  <form id="login" class="adm-login">
    <h1 class="name">Admin</h1>
    <p class="lede">See every receipt, tidy the leaderboard and posts, and download a backup.</p>
    <label for="pw">Admin password<input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="pbtn" type="submit">Sign in</button>
    <p class="err" id="login-err" role="alert"></p>
  </form>
  <div id="panel" hidden>
    <div class="adm-bar">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="ok" aria-selected="true">Added</button>
        <button role="tab" data-tab="rejected" aria-selected="false">Turned down</button>
        <button role="tab" data-tab="players" aria-selected="false">People</button>
        <button role="tab" data-tab="posts" aria-selected="false">Posts</button>
      </div>
      <div class="adm-actions"><a class="textlink" href="/messages#video" target="_blank" rel="noopener">Make messages video</a><button class="textlink" id="backup" type="button">Download backup</button><button class="textlink" id="signout" type="button">Sign out</button></div>
    </div>
    <p class="adm-msg" id="msg" role="status"></p>
    <p class="adm-msg" id="queue"></p>
    <div id="list"></div>
  </div>
</main>
<script src="/assets/admin.js"></script>
</body>
</html>
