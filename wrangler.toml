# Cloudflare Worker for Joash's site. src/worker.js answers /api/...; every other path is a file from dist/.
# Keys go in the Cloudflare dashboard as Secrets (GROQ_API_KEY and ADMIN_PASSWORD), never in this file.
# Optional donation emails need two more Secrets: RESEND_API_KEY (from resend.com) and NOTIFY_EMAIL (where to send them).
# Plain settings go under [vars] below, because Cloudflare takes them from this file.
#
# KEEP THESE THE SAME IN EVERY VERSION: `name`, the [[durable_objects.bindings]] block and the [[migrations]] block.
# The leaderboard, donations and receipts are saved under them. Changing one starts a new, empty database.
# The name below must also match the Worker's name in the Cloudflare dashboard exactly.
name = "joashjobson"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# /api/* always reaches the Worker; a path with no file gets the site's 404 page
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

# Where everything people do is saved: one Durable Object with its own SQLite database (free plan)
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

# Matches the Logs settings in the Cloudflare dashboard, so the two stay in sync
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[vars]
# Joash's World's Greatest Shave page. Receipts only count if they show a donation to this person and page.
FUNDRAISER_NAME = "Joash Jobson"
FUNDRAISER_URL = "https://www.worldsgreatestshave.com/fundraisers/joashj"
# Dollars (AUD) per token. Each person's total is rounded to the nearest token, so at 20, $29 is 1 token and $31 is 2.
TOKEN_PRICE_AUD = "20"
# The top spot on the home page: the first message needs a donation of at least TOP_SPOT_MIN_AUD, and each takeover must beat
# the donation showing by at least TOP_SPOT_STEP_AUD (AUD).
TOP_SPOT_MIN_AUD = "20"
TOP_SPOT_STEP_AUD = "5"
# Groq model that reads receipts (free plan). It must be a Groq vision model that supports strict JSON schema output.
GROQ_MODEL = "qwen/qwen3.8-27b"
# Most receipts Groq checks per day. Each receipt uses about 3,000 of the free plan's 200,000 daily tokens, so 60 stays under it.
# Past this, receipts wait in the queue until the next day.
GROQ_DAILY_LIMIT = "60"
